<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Rent</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#1e1e1e;
  --muted:#2a2a2a;
}

body.light{
  --bg:#f5f5f5;
  --text:#000;
  --card:#fff;
  --muted:#e6e6e6;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.iconBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--muted);
  color:var(--text);
  font-size:22px;
}

/* MENU */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  background:rgba(0,0,0,0.5);
  z-index:998;
}

.overlay.active{display:block;}

.menu{
  position:fixed;
  top:0;
  left:-110%;
  width:260px;
  height:100%;
  background:var(--bg);
  padding:15px;
  transition:0.3s;
  z-index:999;
}

.menu.open{left:0;}

.menuBtn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--muted);
  color:var(--text);
}

/* PROFILE */
.profile{
  text-align:center;
  margin-bottom:10px;
}

.profile img{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#444;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
}

.thumb{
  width:100%;
  height:90px;
  border-radius:12px;
  background:var(--muted);
  margin-bottom:10px;
}

/* PAGE */
.page{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:var(--bg);
  transform:translate3d(100%,0,0);
  transition:transform 0.25s ease;
  z-index:1000;
  padding:15px;
  overflow:auto;
}

.page.open{
  transform:translate3d(0,0,0);
}

/* BADGE */
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:10px;
  background:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">

  <div class="profile">
    <img id="avatar">
    <p id="username"></p>
  </div>

  <button class="menuBtn" onclick="toggleTheme()">🌙 / ☀️ Тема</button>
  <button class="menuBtn">💬 Поддержка</button>
</div>

<div class="topbar">
  <button class="iconBtn" onclick="openMenu()">☰</button>
  <h3 style="margin:0;">Game Rent</h3>
  <div style="width:45px;"></div>
</div>

<div id="catalog" class="grid"></div>

<div id="page" class="page">
  <div id="content"></div>
</div>

<script>

/* ===== TELEGRAM ===== */
const tg = window.Telegram?.WebApp;

let user = {
  id:null,
  name:"Guest",
  avatar:""
};

if(tg && tg.initDataUnsafe?.user){
  const u = tg.initDataUnsafe.user;
  user.id = u.id;
  user.name = u.first_name || "User";
  user.avatar = u.photo_url || "";
}

/* ===== MENU ===== */
function openMenu(){
  document.getElementById("menu").classList.add("open");
  document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
  document.getElementById("menu").classList.remove("open");
  document.getElementById("overlay").classList.remove("active");
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* ===== DATABASE ===== */
const accounts = [
  {id:1,title:"PUBG #001",price:"3$ / час",status:"свободен"},
  {id:2,title:"PUBG #002",price:"5$ / час",status:"свободен"}
];

/* ===== LOAD ===== */
function load(){
  const c=document.getElementById("catalog");
  c.innerHTML="";

  accounts.forEach(a=>{
    c.innerHTML+=`
      <div class="card" onclick="openAcc(${a.id})">
        <div class="thumb"></div>
        <b>${a.title}</b>
        <p>${a.price}</p>
        <span class="badge">${a.status}</span>
      </div>
    `;
  });
}

/* ===== OPEN ===== */
function openAcc(id){

  const a = accounts.find(x=>x.id===id);

  document.getElementById("page").classList.add("open");

  document.getElementById("content").innerHTML = `
    <h2>${a.title}</h2>
    <p>💳 ${a.price}</p>

    <button class="menuBtn" onclick="rent(${a.id})">
      Арендовать
    </button>
  `;
}

/* ===== RENT (MAIN SYSTEM) ===== */
function rent(id){

  const a = accounts.find(x=>x.id===id);
  a.status = "занят";

  load();

  sendToTelegram(a);

  closePage();
}

/* ===== TELEGRAM SEND ===== */
function sendToTelegram(a){

  const text = `
📦 Новая аренда
👤 ${user.name}
🆔 ${user.id}
🎮 ${a.title}
💳 ${a.price}
`;

  if(tg && tg.sendData){
    tg.sendData(JSON.stringify({
      user:user,
      account:a
    }));
  }

  console.log("ORDER:", text);
}

/* ===== CLOSE PAGE ===== */
function closePage(){
  document.getElementById("page").classList.remove("open");
}

/* ===== PROFILE UI ===== */
document.getElementById("username").innerText = user.name;
if(user.avatar) document.getElementById("avatar").src = user.avatar;

/* INIT */
load();

</script>

</body>
</html>
