<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Rent</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#1e1e1e;
  --muted:#2a2a2a;
}

body.light{
  --bg:#f5f5f5;
  --text:#000;
  --card:#fff;
  --muted:#e6e6e6;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  transition:0.25s;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.iconBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--muted);
  color:var(--text);
  font-size:22px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
  transform:scale(1);
  transition:0.2s;
}

.card:active{
  transform:scale(0.97);
}

.thumb{
  width:100%;
  height:90px;
  border-radius:12px;
  background:var(--muted);
  margin-bottom:10px;
}

/* FULL SCREEN PAGE */
.page{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:var(--bg);
  transform:scale(0.9);
  opacity:0;
  pointer-events:none;
  transition:0.25s ease;
  padding:15px;
}

.page.open{
  transform:scale(1);
  opacity:1;
  pointer-events:auto;
}

/* ANIMATION HEADER */
.pageHeader{
  height:200px;
  background:var(--muted);
  border-radius:16px;
  margin-bottom:15px;
}

/* MENU BUTTON */
.iconBtnSmall{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--muted);
  color:var(--text);
  font-size:22px;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <button class="iconBtn" onclick="toggleTheme()">🌙</button>
  <h3 style="margin:0;">Game Rent</h3>
  <div style="width:45px;"></div>
</div>

<!-- CATALOG -->
<div id="catalog" class="grid">

  <div class="card" onclick="openAcc('PUBG #001','3$ / час')">
    <div class="thumb"></div>
    <b>#001</b>
    <p>PUBG Mobile</p>
    <p>3$ / час</p>
  </div>

  <div class="card" onclick="openAcc('PUBG #002','5$ / час')">
    <div class="thumb"></div>
    <b>#002</b>
    <p>PUBG Mobile</p>
    <p>5$ / час</p>
  </div>

</div>

<!-- PAGE -->
<div id="page" class="page">

  <div class="pageHeader"></div>

  <div id="content"></div>

</div>

<script>

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* OPEN */
function openAcc(title, price){
  document.getElementById("page").classList.add("open");

  document.getElementById("content").innerHTML = `
    <h2>${title}</h2>
    <p>💳 ${price}</p>
    <button>Орендувати</button>
  `;
}

/* CLOSE BY SWIPE */
let startX = 0;

document.getElementById("page").addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.getElementById("page").addEventListener("touchmove", e=>{
  if(!document.getElementById("page").classList.contains("open")) return;

  let moveX = e.touches[0].clientX;

  if(moveX - startX > 90){
    closePage();
  }
});

function closePage(){
  document.getElementById("page").classList.remove("open");
}

</script>

</body>
</html>
