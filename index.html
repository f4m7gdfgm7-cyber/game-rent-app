<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Rent</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#1e1e1e;
  --muted:#2a2a2a;
  --menu:#111;
}

body.light{
  --bg:#f5f5f5;
  --text:#000;
  --card:#fff;
  --muted:#e6e6e6;
  --menu:#fff;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.iconBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--muted);
  color:var(--text);
  font-size:22px;
}

/* MENU */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  z-index:998;
}

.overlay.active{display:block;}

.menu{
  position:fixed;
  top:0;
  left:-110%;
  width:260px;
  height:100%;
  background:var(--menu);
  padding:15px;
  transition:0.35s;
  z-index:999;
}

.menu.open{left:0;}

.menuTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
}

.thumb{
  width:100%;
  height:90px;
  border-radius:12px;
  background:var(--muted);
  margin-bottom:10px;
}

/* PAGE FIXED (ВАЖНО) */
.page{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:var(--bg);
  transform:translateX(100%);
  transition:0.35s;
  z-index:1000;
  padding:15px;
  overflow:auto;
}

.page.open{
  transform:translateX(0);
}

.slider{
  width:100%;
  height:180px;
  border-radius:14px;
  background:var(--muted);
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div class="menu" id="menu">

  <div class="menuTop">
    <button class="iconBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <button style="width:100%;margin-top:15px;padding:12px;border-radius:12px;border:none;background:var(--muted);color:var(--text);">
    Войти / Регистрация
  </button>

</div>

<!-- TOP -->
<div class="topbar">
  <button class="iconBtn" onclick="openMenu()">☰</button>
  <h3 style="margin:0;">Game Rent</h3>
  <div style="width:45px;"></div>
</div>

<!-- CATALOG -->
<div id="catalog" class="grid">

  <div class="card" onclick="openAcc('acc1')">
    <div class="thumb"></div>
    <b>#001</b>
    <p>PUBG Mobile</p>
    <p>3$ / час</p>
  </div>

  <div class="card" onclick="openAcc('acc2')">
    <div class="thumb"></div>
    <b>#002</b>
    <p>PUBG Mobile</p>
    <p>5$ / час</p>
  </div>

</div>

<!-- PAGE -->
<div id="page" class="page">

  <div class="slider"></div>

  <div id="content"></div>

</div>

<script>

function openMenu(){
  document.getElementById("menu").classList.add("open");
  document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
  document.getElementById("menu").classList.remove("open");
  document.getElementById("overlay").classList.remove("active");
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* OPEN PAGE */
function openAcc(id){
  document.getElementById("page").classList.add("open");

  let html="";

  if(id==="acc1"){
    html=`
      <h2>#001</h2>
      <p>🎮 PUBG Mobile</p>
      <p>💳 3$ / час</p>
      <button>Орендувати</button>
    `;
  }

  if(id==="acc2"){
    html=`
      <h2>#002</h2>
      <p>🎮 PUBG Mobile</p>
      <p>💳 5$ / час</p>
      <button>Орендувати</button>
    `;
  }

  document.getElementById("content").innerHTML=html;
}

/* SWIPE CLOSE */
let startX = 0;

document.getElementById("page").addEventListener("touchstart", e=>{
  startX = e.touches[0].clientX;
});

document.getElementById("page").addEventListener("touchmove", e=>{
  if(!document.getElementById("page").classList.contains("open")) return;

  let moveX = e.touches[0].clientX;

  if(moveX - startX > 80){
    closePage();
  }
});

function closePage(){
  document.getElementById("page").classList.remove("open");
}

</script>

</body>
</html>
