<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Game Rent</title>
</head>

<body id="body" style="font-family:Arial; margin:0; transition:0.3s;">

<!-- Верхняя панель -->
<div style="padding:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid gray;">
  <h2 style="margin:0;">🎮 Game Rent</h2>

  <button onclick="toggleTheme()" style="padding:8px 12px;">
    🌙 / ☀️
  </button>
</div>

<!-- Каталог -->
<div style="padding:15px;" id="catalog">

  <div onclick="openAcc('acc1')" style="border:1px solid gray; padding:10px; margin-bottom:10px; border-radius:10px; cursor:pointer;">
    <h3>#001</h3>
    <p>🎯 PUBG Mobile</p>
    <p>💳 3$ / час</p>
    <p>🟢 Вільний</p>
  </div>

  <div onclick="openAcc('acc2')" style="border:1px solid gray; padding:10px; border-radius:10px; cursor:pointer;">
    <h3>#002</h3>
    <p>🎯 PUBG Mobile</p>
    <p>💳 5$ / час</p>
    <p>🔴 Зайнятий</p>
  </div>

</div>

<!-- Страница аккаунта -->
<div id="accPage" style="display:none; padding:15px;">
  <button onclick="back()" style="margin-bottom:10px;">⬅ Назад</button>

  <div id="accContent"></div>
</div>

<script>
let dark = false;

function toggleTheme() {
  dark = !dark;

  if (dark) {
    document.getElementById("body").style.background = "#000";
    document.getElementById("body").style.color = "#fff";
  } else {
    document.getElementById("body").style.background = "#fff";
    document.getElementById("body").style.color = "#000";
  }
}

function openAcc(id) {
  document.getElementById("catalog").style.display = "none";
  document.getElementById("accPage").style.display = "block";

  let data = "";

  if (id === "acc1") {
    data = `
      <h2>#001</h2>
      <p>🎮 PUBG Mobile</p>
      <p>💳 3$ / час</p>
      <p>📅 Последняя аренда: сегодня</p>
      <button>Орендувати</button>
    `;
  }

  if (id === "acc2") {
    data = `
      <h2>#002</h2>
      <p>🎮 PUBG Mobile</p>
      <p>💳 5$ / час</p>
      <p>📅 Последняя аренда: вчера</p>
      <button>Орендувати</button>
    `;
  }

  document.getElementById("accContent").innerHTML = data;
}

function back() {
  document.getElementById("catalog").style.display = "block";
  document.getElementById("accPage").style.display = "none";
}
</script>

</body>
</html>
