<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Rent</title>

<style>
:root{
  --bg:#f5f5f5;
  --text:#000;
  --card:#fff;
  --muted:#e6e6e6;
  --menu:#ffffff;
}

body.dark{
  --bg:#000;
  --text:#fff;
  --card:#1e1e1e;
  --muted:#2a2a2a;
  --menu:#111;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  transition:0.3s;
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-bottom:1px solid rgba(128,128,128,0.2);
}

/* ICON BUTTON */
.iconBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:var(--muted);
  color:var(--text);
  font-size:20px;
}

/* MENU */
.menu{
  position:fixed;
  top:0;
  left:-110%;
  width:260px;
  height:100%;
  background:var(--menu);
  color:var(--text);
  padding:15px;
  transition:0.35s;
  z-index:999;
  box-shadow:0 0 20px rgba(0,0,0,0.2);
}

.menu.open{
  left:0;
}

.menuBtn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  background:var(--muted);
  color:var(--text);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
  border:1px solid rgba(128,128,128,0.2);
}

/* IMAGE PLACEHOLDER */
.thumb{
  width:100%;
  height:90px;
  border-radius:12px;
  background:var(--muted);
  margin-bottom:10px;
}

/* PAGE */
.page{
  padding:15px;
}

.slider{
  width:100%;
  height:180px;
  border-radius:14px;
  background:var(--muted);
  margin-bottom:15px;
}
</style>
</head>

<body id="body">

<!-- MENU -->
<div class="menu" id="menu">

  <button class="menuBtn" onclick="closeMenu()">❌ Закрити</button>

  <button class="menuBtn" onclick="toggleTheme()">🌙 / ☀️ Тема</button>

  <button class="menuBtn">👤 Войти / Регистрация</button>

</div>

<!-- TOP -->
<div class="topbar">

  <button class="iconBtn" onclick="openMenu()">☰☰☰</button>

  <h3 style="margin:0;">Game Rent</h3>

  <div style="width:45px;"></div>

</div>

<!-- CATALOG -->
<div id="catalog" class="grid">

  <div class="card" onclick="openAcc('acc1')">
    <div class="thumb"></div>
    <b>#001</b>
    <p>PUBG Mobile</p>
    <p>3$ / час</p>
  </div>

  <div class="card" onclick="openAcc('acc2')">
    <div class="thumb"></div>
    <b>#002</b>
    <p>PUBG Mobile</p>
    <p>5$ / час</p>
  </div>

</div>

<!-- PAGE -->
<div id="page" class="page" style="display:none;">

  <button class="iconBtn" onclick="back()">←</button>

  <div class="slider"></div>

  <div id="content"></div>
</div>

<script>

function openMenu(){
  document.getElementById("menu").classList.add("open");
}

function closeMenu(){
  document.getElementById("menu").classList.remove("open");
}

function toggleTheme(){
  document.getElementById("body").classList.toggle("dark");
}

function openAcc(id){
  document.getElementById("catalog").style.display="none";
  document.getElementById("page").style.display="block";

  let html="";

  if(id==="acc1"){
    html=`
      <h2>#001</h2>
      <p>🎮 PUBG Mobile</p>
      <p>💳 3$ / час</p>
      <button>Орендувати</button>
    `;
  }

  if(id==="acc2"){
    html=`
      <h2>#002</h2>
      <p>🎮 PUBG Mobile</p>
      <p>💳 5$ / час</p>
      <button>Орендувати</button>
    `;
  }

  document.getElementById("content").innerHTML=html;
}

function back(){
  document.getElementById("catalog").style.display="grid";
  document.getElementById("page").style.display="none";
}

</script>

</body>
</html>
