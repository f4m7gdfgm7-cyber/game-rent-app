<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Rent</title>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#1e1e1e;
  --muted:#2a2a2a;
  --overlay:rgba(0,0,0,0.6);
}

body.light{
  --bg:#f5f5f5;
  --text:#000;
  --card:#fff;
  --muted:#e6e6e6;
  --overlay:rgba(0,0,0,0.2);
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.iconBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--muted);
  color:var(--text);
  font-size:22px;
}

/* MENU */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:var(--overlay);
  display:none;
  z-index:998;
}

.overlay.active{
  display:block;
}

.menu{
  position:fixed;
  top:0;
  left:-110%;
  width:260px;
  height:100%;
  background:var(--bg);
  padding:15px;
  transition:0.3s;
  z-index:999;
}

.menu.open{
  left:0;
}

.menuBtn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--muted);
  color:var(--text);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
}

.thumb{
  width:100%;
  height:90px;
  border-radius:12px;
  background:var(--muted);
  margin-bottom:10px;
}

/* PAGE */
.page{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:var(--bg);
  transform:translateX(100%);
  transition:0.25s cubic-bezier(.2,.8,.2,1);
  z-index:1000;
  padding:15px;
  overflow:auto;
}

.page.open{
  transform:translateX(0);
}

.page.dragging{
  transition:none;
}
</style>
</head>

<body>

<!-- MENU -->
<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">
  <button class="menuBtn" onclick="toggleTheme()">🌙 / ☀️ Тема</button>
  <button class="menuBtn">👤 Войти / Регистрация</button>
</div>

<!-- TOP -->
<div class="topbar">
  <button class="iconBtn" onclick="openMenu()">☰</button>
  <h3 style="margin:0;">Game Rent</h3>
  <div style="width:45px;"></div>
</div>

<!-- CATALOG -->
<div id="catalog" class="grid">

  <div class="card" onclick="openAcc('PUBG #001','3$ / час')">
    <div class="thumb"></div>
    <b>#001</b>
    <p>PUBG Mobile</p>
    <p>3$ / час</p>
  </div>

  <div class="card" onclick="openAcc('PUBG #002','5$ / час')">
    <div class="thumb"></div>
    <b>#002</b>
    <p>PUBG Mobile</p>
    <p>5$ / час</p>
  </div>

</div>

<!-- PAGE -->
<div id="page" class="page">
  <div id="content"></div>
</div>

<script>

function openMenu(){
  document.getElementById("menu").classList.add("open");
  document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
  document.getElementById("menu").classList.remove("open");
  document.getElementById("overlay").classList.remove("active");
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* OPEN ACCOUNT */
function openAcc(title, price){

  document.getElementById("page").classList.add("open");

  document.getElementById("content").innerHTML = `
    <h2>${title}</h2>
    <p>💳 ${price}</p>
    <button>Орендувати</button>
  `;

  if(navigator.vibrate){
    navigator.vibrate(30);
  }
}

/* CLOSE */
function closePage(){
  document.getElementById("page").classList.remove("open");

  if(navigator.vibrate){
    navigator.vibrate(20);
  }
}

/* ===== IMPROVED SWIPE (drag feeling) ===== */

let startX = 0;
let currentX = 0;
let dragging = false;

const page = document.getElementById("page");

page.addEventListener("touchstart",(e)=>{
  startX = e.touches[0].clientX;
  dragging = true;
  page.classList.add("dragging");
});

page.addEventListener("touchmove",(e)=>{
  if(!dragging) return;

  currentX = e.touches[0].clientX;
  let diff = currentX - startX;

  const screenWidth = window.innerWidth;

  // только левая зона
  if(startX < screenWidth / 3 && diff > 0){
    page.style.transform = `translateX(${diff}px)`;
  }
});

page.addEventListener("touchend",()=>{
  dragging = false;
  page.classList.remove("dragging");

  let diff = currentX - startX;

  page.style.transform = "";

  const screenWidth = window.innerWidth;

  if(startX < screenWidth / 3 && diff > 80){
    closePage();
  }
});

</script>

</body>
</html>
