<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Rent</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#000;
  --text:#fff;
  --card:#1e1e1e;
  --muted:#2a2a2a;
}

body.light{
  --bg:#f5f5f5;
  --text:#000;
  --card:#fff;
  --muted:#e6e6e6;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
}

/* TOP */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}

.iconBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  background:var(--muted);
  color:var(--text);
  font-size:22px;
}

/* MENU */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  background:rgba(0,0,0,0.5);
  z-index:998;
}

.overlay.active{display:block;}

.menu{
  position:fixed;
  top:0;
  left:-110%;
  width:260px;
  height:100%;
  background:var(--bg);
  padding:15px;
  transition:0.3s;
  z-index:999;
}

.menu.open{left:0;}

.menuBtn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
  border:none;
  background:var(--muted);
  color:var(--text);
}

/* PROFILE */
.profile{
  text-align:center;
  margin-bottom:10px;
}

.profile img{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#444;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:10px;
  cursor:pointer;
}

.thumb{
  width:100%;
  height:90px;
  border-radius:12px;
  background:var(--muted);
  margin-bottom:10px;
}

/* PAGE */
.page{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:var(--bg);
  transform:translate3d(100%,0,0);
  transition:transform 0.25s ease;
  z-index:1000;
  padding:15px;
  overflow:auto;
}

.page.open{
  transform:translate3d(0,0,0);
}

/* GALLERY */
.gallery{
  width:100%;
  height:220px;
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  border-radius:14px;
  background:var(--muted);
  margin-bottom:15px;
}

.slide{
  min-width:100%;
  height:100%;
  scroll-snap-align:center;
  background:var(--muted);
}

/* BADGE */
.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:10px;
  background:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="menu" id="menu">

  <div class="profile">
    <img id="avatar">
    <p id="username">Guest</p>
  </div>

  <button class="menuBtn" onclick="toggleTheme()">🌙 / ☀️ Тема</button>
  <button class="menuBtn">👤 Профиль</button>
  <button class="menuBtn">💬 Поддержка</button>
</div>

<div class="topbar">
  <button class="iconBtn" onclick="openMenu()">☰</button>
  <h3 style="margin:0;">Game Rent</h3>
  <div style="width:45px;"></div>
</div>

<!-- CATALOG -->
<div id="catalog" class="grid"></div>

<!-- PAGE -->
<div id="page" class="page">
  <div id="content"></div>
</div>

<script>

/* ===== TELEGRAM USER ===== */
const tg = window.Telegram?.WebApp;

let user = {
  id:null,
  name:"Guest",
  avatar:""
};

function initTelegram(){
  if(tg && tg.initDataUnsafe?.user){
    const u = tg.initDataUnsafe.user;

    user.id = u.id;
    user.name = u.first_name || "User";
    user.avatar = u.photo_url || "";
  }
}

/* ===== LOCAL STORAGE ===== */
function loadUser(){
  const saved = localStorage.getItem("user");
  if(saved && (!user.id)){
    user = JSON.parse(saved);
  }
}

function saveUser(){
  localStorage.setItem("user", JSON.stringify(user));
}

/* ===== PROFILE UI ===== */
function renderProfile(){
  document.getElementById("username").innerText = user.name;

  if(user.avatar){
    document.getElementById("avatar").src = user.avatar;
  }
}

/* ===== MENU ===== */
function openMenu(){
  document.getElementById("menu").classList.add("open");
  document.getElementById("overlay").classList.add("active");
}

function closeMenu(){
  document.getElementById("menu").classList.remove("open");
  document.getElementById("overlay").classList.remove("active");
}

function toggleTheme(){
  document.body.classList.toggle("light");
}

/* ===== DATABASE ===== */
const accounts = [
  {id:1,title:"PUBG #001",price:"3$ / час",status:"свободен"},
  {id:2,title:"PUBG #002",price:"5$ / час",status:"занят"}
];

/* ===== LOAD CARDS ===== */
function load(){
  const c=document.getElementById("catalog");
  c.innerHTML="";

  accounts.forEach(a=>{
    c.innerHTML+=`
      <div class="card" onclick="openAcc(${a.id})">
        <div class="thumb"></div>
        <b>${a.title}</b>
        <p>${a.price}</p>
        <span class="badge">${a.status}</span>
      </div>
    `;
  });
}

/* ===== OPEN ACCOUNT ===== */
function openAcc(id){

  const a = accounts.find(x=>x.id===id);

  document.getElementById("page").classList.add("open");

  document.getElementById("content").innerHTML = `
    <div class="gallery">
      <div class="slide"></div>
      <div class="slide"></div>
      <div class="slide"></div>
      <div class="slide"></div>
      <div class="slide"></div>
    </div>

    <h2>${a.title}</h2>
    <p>💳 ${a.price}</p>
    <p>📦 ${a.status}</p>

    <button class="menuBtn">1 час</button>
    <button class="menuBtn">3 часа</button>
    <button class="menuBtn">6 часа</button>

    <button class="menuBtn" style="margin-top:10px;">Орендувати</button>
  `;
}

/* ===== SWIPE CLOSE ===== */
let startX=0;
let startY=0;

const page=document.getElementById("page");

page.addEventListener("touchstart",(e)=>{
  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;
});

page.addEventListener("touchend",(e)=>{

  let endX=e.changedTouches[0].clientX;
  let endY=e.changedTouches[0].clientY;

  let dx=endX-startX;
  let dy=Math.abs(endY-startY);

  const w=window.innerWidth;

  if(startX < w/3 && dx>90 && dy<80){
    closePage();
  }
});

function closePage(){
  document.getElementById("page").classList.remove("open");
}

/* ===== INIT ===== */
initTelegram();
loadUser();
renderProfile();
load();

</script>

</body>
</html>
